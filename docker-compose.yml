services:
  sptlfs:
    image: ghcr.io/sp-tushonka/lfs:master
    container_name: sptlfs
    restart: unless-stopped
    ports:
      - "5420:5420"
    # Uncomment for verbose per-request logging when diagnosing a reverse proxy setup.
    # environment:
    #   - Logging__LogLevel__SPTushonka.LFS=Debug
    volumes:
      - ./config.jsonc:/app/config.jsonc:ro
      - ./lfs-data:/app/data
