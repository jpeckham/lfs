name: Build and Publish Docker Image

on:
  push:
    branches: ['master']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image-ref.outputs.ref }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=master  
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Deploy the exact digest we just pushed rather than :master, so a retried
      # deploy can never pick up a newer image than the one this run built.
      - name: Compute image reference
        id: image-ref
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # Server-specific settings belong in docker-compose.override.yml, which is
      # never copied and so survives a deploy.
      - name: Copy compose file to server
        run: scp -i ~/.ssh/deploy_key docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Pull and restart on the server
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<SCRIPT
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          echo 'LFS_IMAGE=${{ needs.build-and-push-image.outputs.image }}' > .env
          docker compose pull
          docker compose up -d
          for i in \$(seq 1 20); do
            curl -fsS --max-time 2 http://localhost:5420/health && break
            [ "\$i" = 20 ] && { docker compose logs --tail=50; exit 1; }
            sleep 2
          done
          docker image prune -f --filter 'label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}'
          docker logout ghcr.io
          SCRIPT
