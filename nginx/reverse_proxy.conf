# Basic Nginx reverse proxy setup for SPTushonka.LFS.
# Ensures SPTushonka.LFS works correctly behind Nginx.
# Add SSL or other features as needed.
#
# Set Options.TrustedProxies in config.jsonc to this proxy's address (e.g. ["127.0.0.1"]),
# otherwise forwarded headers are accepted from anyone and rate limiting can be bypassed.
server {
        listen 80;
        server_name example.com;
        client_max_body_size 0;

        location / {
           proxy_pass http://127.0.0.1:5420/;
           proxy_set_header Host $host;
           proxy_set_header X-FORWARDED-PROTO $scheme;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Url-Scheme $scheme;
           proxy_redirect off;

           # LFS objects can be large and slow to push.
           proxy_request_buffering off;
           client_body_timeout 600s;
           proxy_read_timeout 600s;
           proxy_send_timeout 600s;
        }
}
